[package]
name = "trim-galore"
version = "2.5.0"
edition = "2024"
rust-version = "1.88"
description = "Fast adapter and quality trimming for NGS data"
license = "GPL-3.0-only"
authors = ["Felix Krueger"]
repository = "https://github.com/FelixKrueger/TrimGalore"
homepage = "https://github.com/FelixKrueger/TrimGalore"
keywords = ["bioinformatics", "ngs", "adapter-trimming", "fastq", "quality-trimming"]
categories = ["command-line-utilities", "science"]
readme = "README.md"
exclude = [
    "test_files/",
    "plans/",
    "docs/",
    ".github/",
    ".claude/",
    "CLAUDE.md",
    "CHANGELOG.md",
]

[[bin]]
name = "trim_galore"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
gzp = { version = "2.0.3", default-features = false, features = ["deflate_rust"] }
anyhow = "1"
env_logger = "0.11"
# Bundled FastQC integration, tracking Java FastQC 0.13.0. Exact-pinned: the
# report is a tested output surface, so bumps are deliberate-test events.
# See /Users/fkrueger/.claude/plans/bundled-fastqc-rust.md for the design notes.
fastqc-rust = "=1.1.1"
# uBAM input support (#316). Exact-pinned to the version already pulled
# transitively via fastqc-rust 1.1.1 — using the `noodles` umbrella crate with
# features=["bam"] reuses that tree rather than forcing a parallel-version
# compile. Treat upstream bumps as deliberate-test events.
# See plans/06252026_ubam-input-support/PLAN.md §5 step 1.
noodles = { version = "=0.88.0", default-features = false, features = ["bam"] }
# Global allocator; measurements and platform caveats are in the commit message. Exact-pinned like fastqc-rust and noodles, so treat upstream bumps as deliberate-test events.
mimalloc = "=0.1.52"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# Already in the dep graph (transitive via noodles); promoted to a direct
# dev-dep so test code can construct `bstr::BStr` for noodles-aux-Value
# variants that take `&'a BStr` (e.g. `Value::Hex`).
bstr = "1"
# Already in the dep graph (transitive via fastqc-rust); promoted to a direct
# dev-dep so test code can read fastqc_data.txt out of the report archive.
# Features mirror fastqc-rust's own spec, so the resolved tree is unchanged.
zip = { version = "9", default-features = false, features = ["deflate", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
