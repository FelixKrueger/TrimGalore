name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master, dev]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ci.yml's docs-build job builds the same site to gate PRs; keep the steps in step.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Astro requires >=22.12.0; pin to 24 (current Active LTS).
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Kept in step with ci.yml's identical assertion. This is the publishing
      # path, so this is the copy that can actually stop a bad render shipping.
      - name: Assert no silent render corruption
        run: |
          test -d dist
          # Positive control: prove these greps can still match before trusting a
          # null result. clumpy.md's $$ display maths is the one page that must
          # always be found, and the only legitimate KaTeX on the site.
          grep -rlF --include='*.html' -- 'class="katex' dist \
            | grep -q '^dist/performance/clumpy/index.html$' \
            || { echo "::error::positive control failed - clumpy maths not found, so a clean result here proves nothing"; exit 1; }
          fail=0
          for pat in 'katex-error' '<img[^>]*src="[Dd]ocs/' '<del>'; do
            if grep -rlE --include='*.html' -- "$pat" dist; then
              echo "::error::'$pat' in built output (files above)"
              echo "  <del> means a bare '~' opened GFM strikethrough: escape it as \\~ in the source .md."
              fail=1
            fi
          done
          # Any other page with rendered maths means a bare $ in prose was parsed.
          stray=$(grep -rlF --include='*.html' -- 'class="katex' dist \
                  | grep -v '^dist/performance/clumpy/index.html$' || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected rendered maths (a bare \$ in prose?):"
            echo "$stray"
            fail=1
          fi
          exit $fail

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # `dev` is the canonical live-content source — every push that touches
    # docs/** ships to www.trimgalore.com immediately. `master` is a release
    # pin only (updated by FF from dev just before a release cut), and any
    # push to it still re-deploys defensively in case dev was bypassed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
